; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env]
custom_fw_version = '3.2'
framework = arduino
monitor_speed = 115200
# Pinned to the last espressif32 that ships Arduino core 2.x. Core 3.3.x breaks
# this project two ways: the larger binaries overflow the 1.3 MB app partition in
# most environments, and Wire switched to the new ESP-IDF I2C driver, which
# aborts at boot when linked alongside epdiy's legacy driver/i2c.h.
platform = espressif32@6.11.0
extra_scripts = 
    pre:scripts/generate_clangd_config.py
    pre:scripts/set_build_date.py

[common]
# Attention! Display type and model are defined to be 
# first supported display in source code just to get through 
# compilation checks on GitHub, comment them out for your own display type
build_flags =
    -D COLOR_TYPE=BW # Comment out this for your own display type enabled by you in display.h
    -D DISPLAY_TYPE=GDEW0154T8 # Also comment out this
lib_deps_builtin =
    SPI
    Wire
lib_deps =
    zinggjm/GxEPD2@^1.6.6
    jnthas/Improv WiFi Library@^0.0.4
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit GFX Library@^1.11.9
    sensirion/Sensirion I2C SHT4x@^1.1.2
    adafruit/Adafruit BME280 Library@^2.3.0
    sparkfun/SparkFun SCD4x Arduino Library@^1.1.2
    sensirion/Sensirion I2C STCC4@^1.0.0
    kikuchan98/pngle@^1.1.0
lib_ignore = GxEPD2_4G

# LáskaKit ESPInk 2.x, ESP32-WROOM-32, ADC battery measurement
[env:espink]
board = esp32dev
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=ESPink_V2
    -D SENSOR # one build with sensor
lib_deps =
    ${common.lib_deps_builtin}
    ${common.lib_deps}
lib_ignore = ${common.lib_ignore}

# LáskaKit ESPInk 3.0-3.4, ESP32-S3, with FuelGauge, about 100 pcs
[env:espink_v3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=ESPink_V3
    -D SENSOR # one build with sensor
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${common.lib_deps_builtin}
    ${common.lib_deps}
    sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4
lib_ignore = ${common.lib_ignore}

# Board from dronecz
[env:es3ink]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=ES3ink
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${common.lib_deps_builtin}
    ${common.lib_deps}
    adafruit/Adafruit NeoPixel@^1.12.0
lib_ignore = ${common.lib_ignore}

[env:MakerBadge]
board = featheresp32-s2
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=MakerBadge_revB
lib_deps =
    ${common.lib_deps_builtin}
    ${common.lib_deps}
lib_ignore = ${common.lib_ignore}

# XIAO 7.5" ePaper Panel - https://www.seeedstudio.com/XIAO-7-5-ePaper-Panel-p-6416.html
[env:seeedstudio_xiao_esp32c3]
board = seeed_xiao_esp32c3
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=SEEEDSTUDIO_XIAO_ESP32C3
    -D DISPLAY_TYPE=WS75BWT7
lib_deps =
    ${common.lib_deps}
    ${common.lib_deps_builtin}
lib_ignore = ${common.lib_ignore}

# SVERIO SPI PAPERBOARD (ESP32-S3, custom SPI ePaper board)
[env:sverio_paperboard_spi]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default.csv
build_flags =
    ${common.build_flags}
    -D BOARD_TYPE=SVERIO_PAPERBOARD_SPI
    -D REMAP_SPI
    -D SENSOR # one build with sensor
lib_deps =
    ${common.lib_deps_builtin}
    ${common.lib_deps}
lib_ignore = ${common.lib_ignore}

# SVERIO EPDIY PAPERBOARD (parallel interface), works for EPDIY V7
[env:sverio_paperboard_epdiy]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
build_flags =
    -D COLOR_TYPE=8G 
    -D DISPLAY_TYPE=ED097TC2_EPDIY
    # -D DISPLAY_TYPE=ED133UT2_EPDIY #uncomment for ED133UT2/GDEP133UT3 display
    #-D EPDIY_VCOM=1500 # uncomment for displays with exact VCOM value
    -D BOARD_TYPE=SVERIO_PAPERBOARD_EPDIY
    -D USE_EPDIY_DRIVER
    -D SENSOR # one build with sensor
lib_deps =
    ${common.lib_deps_builtin}
    ${common.lib_deps}
    https://github.com/Pajenicko/epdiy.git#d7c7838
lib_ignore =
    GxEPD2
    GxEPD2_4G

# SVERIO EPDIY PAPERBOARD + SIMCom A7682E LTE modem instead of Wi-Fi.
# The modem board (lte-a7682e-carrier, or the earlier lte-a7682e-daughter)
# plugs into the Paperboard's U11 (SH 1.0 mm, 6p) and sits in-line on the
# battery: pack -> BAT_IN, BAT_OUT -> Paperboard CN1. See README for details.
[env:sverio_paperboard_epdiy_lte]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
build_flags =
    -D COLOR_TYPE=8G
    -D DISPLAY_TYPE=ED060XC3_EPDIY
    # -D DISPLAY_TYPE=ED097TC2_EPDIY #uncomment for ED097TC2 display
    # -D DISPLAY_TYPE=ED133UT2_EPDIY #uncomment for ED133UT2/GDEP133UT3 display
    #-D EPDIY_VCOM=300 # uncomment and set to the VCOM value printed on the display
    -D BOARD_TYPE=SVERIO_PAPERBOARD_EPDIY
    -D USE_EPDIY_DRIVER
    -D SENSOR # one build with sensor
    # --- cellular instead of Wi-Fi ---
    -D USE_LTE_MODEM
    -D LTE_PIN_RX=10    # D9  / U11.3 -> J3.3 MCU_RX
    -D LTE_PIN_TX=11    # D10 / U11.4 -> J3.4 MCU_TX
    -D LTE_PIN_DTR=12   # D11 / U11.5 -> J3.5 DTR
    -D LTE_PIN_PWR_EN=13 # D12 / U11.6 -> J3.6 EN (HIGH = modem powered)
    -D LTE_BAUD=115200 # no AT+IPR switch; 460800 is faster but some A7682E samples reboot on it
    # -D LTE_APN='"internet"' # force an APN, otherwise AT+CGNAPN / SIM default is used
    # -D LTE_KEEP_POWERED # keep the modem registered and use AT+CSCLK sleep instead of cutting EN
    # -D LTE_FORCE_BAND=20 # pin the LTE search to one band; a low band (20=800, 8=900 MHz) needs less transmit power
    # -D LTE_PREFER_LTE_ONLY=0 # allow the GSM fallback on a cold search (its TDMA bursts are the harshest load)
    # -D LTE_RADIO_SETTLE_MS=1500 # quiet time with the radio parked before the first search
    # -D LOG_LEVEL_MINIMUM=Logger::Level::DEBUG # uncomment to log the full AT conversation
lib_deps =
    ${common.lib_deps_builtin}
    bblanchon/ArduinoJson@^7.2.1
    adafruit/Adafruit GFX Library@^1.11.9
    sensirion/Sensirion I2C SHT4x@^1.1.2
    adafruit/Adafruit BME280 Library@^2.3.0
    sparkfun/SparkFun SCD4x Arduino Library@^1.1.2
    sensirion/Sensirion I2C STCC4@^1.0.0
    kikuchan98/pngle@^1.1.0
    https://github.com/Pajenicko/epdiy.git#d7c7838
lib_ignore =
    GxEPD2
    GxEPD2_4G
    WiFiManager
